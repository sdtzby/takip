* {

body {

.hide-scrollbar::-webkit-scrollbar {
    display: none;
}

.hide-scrollbar {
    scrollbar-width: none;
}

.day-button {
    min-width: 82px;
}

.checkbox {
    appearance: none;

    width: 28px;
    height: 28px;
    min-width: 28px;

    border: 2px solid #cbd5e1;

    border-radius: 9px;

    background: white;

    position: relative;
}

.checkbox:checked {
    background: #22c55e;
    border-color: #22c55e;
}

.checkbox:checked::after {
    content: "✓";

    position: absolute;

    color: white;

    font-size: 18px;

    font-weight: 700;

    left: 4px;
    top: 0;
}

.meal-card {
    transition: transform .15s ease;
}

.meal-card:active {
    transform: scale(.99);
}

.bottom-nav {

/* NOTLAR */

.note-content {
    line-height: 1.85;
    font-size: 16px;
}

.note-content p {
    margin-bottom: 18px;
}

.note-bullet {
    display: flex;

    align-items: flex-start;

    gap: 10px;

    margin-bottom: 14px;
}

.note-bullet-mark {
    color: #34d399;

    font-weight: 800;

    font-size: 20px;

    line-height: 1.65;
}

.note-accordion-content {
    max-height: 0;

    opacity: 0;

    overflow: hidden;

    transition:

}

.note-accordion-content.open {
    opacity: 1;
}

.note-arrow {
    transition:

/* =====================================================
   TARİH
===================================================== */

function calculateCurrentDay() {

    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );


    const start =
        new Date(
            DIET_START_DATE
        );

    start.setHours(
        0,
        0,
        0,
        0
    );


    const diff =
        Math.floor(
            (
                today - start
            ) /
            86400000
        );


    return Math.min(
        30,
        Math.max(
            DIET_START_DAY,
            DIET_START_DAY + diff
        )
    );

}


function getDateForDay(
    day
) {

    const date =
        new Date(
            DIET_START_DATE
        );


    date.setDate(
        date.getDate() +
        day -
        DIET_START_DAY
    );


    return date;

}


function formatDate(
    date
) {

    return date.toLocaleDateString(
        "tr-TR",
        {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   GÜN SEÇİMİ
===================================================== */

function createDaySelector() {

    const container =
        document.getElementById(
            "daySelector"
        );


    container.innerHTML =
        "";


    for (
        let day =
            DIET_START_DAY;

        day <= 30;

        day++
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.dataset.day =
            day;


        button.className =
            "day-button flex-shrink-0 px-4 py-3 rounded-2xl bg-slate-100 text-slate-500";


        const date =
            getDateForDay(
                day
            );


        button.innerHTML = `

            <div class="font-bold text-sm">
                ${day}. Gün
            </div>

            <div class="text-[11px] mt-1">
                ${date.toLocaleDateString(
                    "tr-TR",
                    {
                        day: "numeric",
                        month: "short"
                    }
                )}
            </div>

        `;


        button.addEventListener(
            "click",
            async () => {

                currentDay =
                    day;


                updateDaySelector();
                updateQuoteHeart();

                await loadDay(
                    day
                );

            }
        );


        container.appendChild(
            button
        );

    }

}


function updateDaySelector() {

    document
        .querySelectorAll(
            ".day-button"
        )
        .forEach(
            button => {

                const day =
                    Number(
                        button.dataset.day
                    );


                if (
                    day ===
                    currentDay
                ) {

                    button.className =
                        "day-button flex-shrink-0 px-4 py-3 rounded-2xl bg-green-500 text-white shadow-sm";

                } else {

                    button.className =
                        "day-button flex-shrink-0 px-4 py-3 rounded-2xl bg-slate-100 text-slate-500";

                }

            }
        );


    const selected =
        document.querySelector(
            `[data-day="${currentDay}"]`
        );


    if (selected) {

        selected.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "center"
        });

    }

}


/* =====================================================

===================================================== */

async function loadDay(

) {

    updateHeader();


    document.getElementById(

            <div class="text-4xl mb-3">

    `;


    const ref =
        doc(
            db,
            "gunler",
            String(day)
        );


    const snap =
        await getDoc(
            ref
        );


    currentDayData =
        snap.exists()
            ? snap.data()
            : {};


    renderWater();
    renderFood();

    renderTasks();

    renderMedications();

    renderNotes();

}


function updateHeader() {

    const date =
        getDateForDay(
            currentDay
        );


    document.getElementById(
        "headerTitle"
    ).textContent =
        `${currentDay}. Gün`;


    document.getElementById(
        "headerDate"
    ).textContent =
        formatDate(
            date
        );

}


/* =====================================================
   GLOBAL
===================================================== */

async function loadGlobalData() {

    const ref =
        doc(
            db,
            "ayarlar",
            "genel"
        );


    const snap =
        await getDoc(
            ref
        );


    globalData =
        snap.exists()
            ? snap.data()
            : {};

    await loadDailyQuotes();

}

/* =====================================================
   GÜNÜN SÖZÜ
===================================================== */
async function loadDailyQuotes() {
    try {
        const snap = await getDoc(doc(db, "ayarlar", "gunlukSozler"));
        dailyQuotes = snap.exists() ? (snap.data().quotes || {}) : {};
    } catch (error) {
        console.error("Günün sözleri okunamadı:", error);
        dailyQuotes = {};
    }
    updateQuoteHeart();
}
function getQuoteForDay(day) {
    const value = dailyQuotes[String(day)];
    if (typeof value === "string") return value.trim();
    if (value && typeof value === "object") return String(value.text || value.content || value.icerik || "").trim();
    return "";
}
function updateQuoteHeart() {
    const button = document.getElementById("dailyQuoteButton");
    if (button) button.classList.toggle("empty", !getQuoteForDay(currentDay));
}
function openQuoteModal() {
    const modal = document.getElementById("quoteModal");
    const dayTitle = document.getElementById("quoteModalDay");
    const body = document.getElementById("quoteModalBody");
    const realDay = calculateCurrentDay();
    const selectedDay = currentDay;
    const quote = getQuoteForDay(selectedDay);
    dayTitle.textContent = `${selectedDay}. Gün`;
    if (selectedDay > realDay) {
        body.innerHTML = `<div class="text-4xl mb-4">🤭</div><p class="font-bold text-slate-800 text-xl">Hop, biraz sabır güzelim!</p><p class="mt-3 text-slate-500">${selectedDay}. günün sözü henüz açılmadı. O gün geldiğinde seni bekleyen küçük bir sürpriz var. 🌷</p><p class="mt-4 text-sm text-pink-400 font-semibold">Şimdilik merak etmek serbest. ❤️</p>`;
    } else if (!quote) {
        body.innerHTML = `<div class="text-4xl mb-4">🌷</div><p class="text-slate-500">Bu gün için henüz bir söz eklenmemiş.</p>`;
    } else {
        body.innerHTML = `<div class="text-4xl mb-4">“</div><p class="font-medium text-slate-700">${escapeHtml(quote)}</p><p class="mt-5 text-sm text-pink-400 font-semibold">Bugün de yanındayım. ❤️</p>`;
    }
    modal.classList.remove("hidden");
    modal.classList.add("flex");
}
function closeQuoteModal() {
    const modal = document.getElementById("quoteModal");
    modal.classList.add("hidden");
    modal.classList.remove("flex");
}
document.getElementById("dailyQuoteButton").addEventListener("click", openQuoteModal);
document.getElementById("closeQuoteModal").addEventListener("click", closeQuoteModal);
document.getElementById("quoteModalCloseButton").addEventListener("click", closeQuoteModal);
document.getElementById("quoteModal").addEventListener("click", event => {
    if (event.target.id === "quoteModal") closeQuoteModal();
});

/* =====================================================
   İLAÇLAR
===================================================== */

async function loadMedications() {

    try {

        const snap =
            await getDoc(
                doc(
                    db,
                    "ayarlar",
                    "ilaclar"
                )
            );

        if (!snap.exists()) {
            medications = [];
            console.log(
                "Firestore'da ayarlar/ilaclar bulunamadı."
            );
            return;
        }

        const data =
            snap.data();

        medications =
            Array.isArray(
                data.ilaclar
            )
                ? data.ilaclar
                : [];

        console.log(
            "Okunan ilaçlar:",
            medications
        );

    } catch (error) {

        console.error(
            "İlaçlar okunamadı:",
            error
        );

        medications = [];

        const container =
            document.getElementById(
                "medsContent"
            );

        if (container) {
            container.innerHTML = `
                <div class="bg-white rounded-3xl border border-red-100 shadow-sm p-6 text-center">
                    <div class="text-3xl mb-3">⚠️</div>
                    <p class="font-semibold text-red-700">
                        İlaç bilgileri alınamadı.
                    </p>
                    <p class="text-xs text-slate-500 mt-2">
                        ${escapeHtml(
                            error?.message ||
                            "Firestore erişim hatası"
                        )}
                    </p>
                </div>
            `;
        }
    }
}

                states[key] === true;


            html += `

                <label
                    class="meal-card block bg-white rounded-3xl border border-slate-100 shadow-sm p-5 cursor-pointer">

                    <div class="flex items-start gap-4">

                        <div
                            class="w-12 h-12 rounded-2xl bg-green-50 flex items-center justify-center text-xl flex-shrink-0">

                            ${meal.icon}

                        </div>


                        <div class="flex-1 min-w-0">

                            <div class="flex items-center justify-between gap-3">

                                <h3 class="font-bold text-slate-800">
                                    ${meal.title}
                                </h3>


                                <input
                                    type="checkbox"
                                    class="checkbox flex-shrink-0"
                                    data-type="meal"
                                    data-index="${index}"
                                    ${checked ? "checked" : ""}
                                >

                            </div>


                            <div
                                class="mt-3 text-[16px] leading-7 ${
                                    checked
                                    ? "text-slate-400 line-through"
                                    : "text-slate-600"
                                }">

                                ${formatMealContent(
                                    value
                                )}

                            </div>

                        </div>

                    </div>

                </label>

            `;

        }
    );


    html +=
        "</div>";


    if (
        !hasFood
    ) {

        html = `

            <div class="bg-white rounded-3xl border border-slate-100 p-8 text-center">

                <div class="text-4xl mb-3">
                    🍽️
                </div>

                <p class="text-slate-500">
                    Bu gün için henüz yemek planı eklenmemiş.
                </p>

            </div>

        `;

    }


    container.innerHTML =
        html;


    attachCheckboxEvents();

}


/* =====================================================
   YEMEK İÇERİĞİ
===================================================== */

function formatMealContent(
    value
) {

    if (
        Array.isArray(
            value
        )
    ) {

        return value
            .map(
                item =>
                    `<div class="mb-1">• ${escapeHtml(item)}</div>`
            )
            .join("");

    }


    return String(
        value
    )
        .split(
            /\r?\n/
        )
        .map(
            line => {

                const text =
                    line.trim();


                if (
                    !text
                ) {

                    return "<div class='h-2'></div>";

                }


                if (
                    /^[-–—]\s*/.test(
                        text
                    )
                ) {

                    return `
                        <div class="flex gap-2 mb-1">
                            <span class="text-green-400 font-bold">−</span>
                            <span>${escapeHtml(
                                text.replace(
                                    /^[-–—]\s*/,
                                    ""
                                )
                            )}</span>
                        </div>
                    `;

                }


                return `
                    <div class="mb-1">
                        ${escapeHtml(text)}
                    </div>
                `;

            }
        )
        .join("");

}


/* =====================================================
   CHECKBOX
===================================================== */

function getCompletedStates() {

    return currentDayData.durumlar ||
        currentDayData.tamamlananlar ||
        {};

}


function attachCheckboxEvents() {

    document
        .querySelectorAll(
            ".checkbox"
        )
        .forEach(
            checkbox => {

                checkbox.addEventListener(
                    "change",
                    async () => {

                        const type =
                            checkbox.dataset.type;


                        const index =
                            Number(
                                checkbox.dataset.index
                            );


                        const key =
                            type === "meal"
                                ? `meal_${index}`
                                : `gorev_${index}`;


                        const states = {

                            ...getCompletedStates()

                        };


                        states[key] =
                            checkbox.checked;


                        currentDayData.durumlar =
                            states;


                        await setDoc(
                            doc(
                                db,
                                "gunler",
                                String(currentDay)
                            ),
                            {
                                durumlar:
                                    states
                            },
                            {
                                merge: true
                            }
                        );


                        if (
                            type ===
                            "meal"
                        ) {

                            renderFood();

                        } else {

                            renderTasks();

                        }

                    }
                );

            }
        );

}


/* =====================================================
   GÖREVLER

/* =====================================================
   SU
===================================================== */

function renderWater() {
    const container = document.getElementById("waterContent");
    const states = getCompletedStates();
    let completed = 0;
    for (let i = 1; i <= 8; i++) if (states[`su_${i}`] === true) completed++;
    const liters = completed * 0.5;
    const percent = Math.min(100, (liters / 1.5) * 100);
    let html = `<div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-5">
        <div class="flex items-center justify-between gap-3 mb-4">
            <div><div class="flex items-center gap-2"><span class="text-xl">💧</span><h2 class="font-bold text-slate-800">Su Takibi</h2></div><p class="text-xs text-slate-400 mt-1">Her kutu 500 ml · En az 1,5 L hedef</p></div>
            <div class="text-right"><div class="text-lg font-bold text-green-600">${liters.toFixed(1).replace(".",",")} L</div><div class="text-[11px] text-slate-400">${completed} × 500 ml</div></div>
        </div>
        <div class="h-2 bg-slate-100 rounded-full overflow-hidden mb-4"><div class="h-full bg-green-400 rounded-full transition-all" style="width:${percent}%"></div></div>
        <div class="grid grid-cols-4 gap-2">`;
    for (let i = 1; i <= 8; i++) {
        const checked = states[`su_${i}`] === true;
        html += `<label class="cursor-pointer"><input type="checkbox" class="water-checkbox hidden" data-water-key="su_${i}" ${checked ? "checked" : ""}><div class="water-option text-center py-3 rounded-2xl border ${checked ? "bg-green-100 border-green-400 text-green-700" : "bg-slate-50 border-slate-100 text-slate-500"}"><div class="text-base">${checked ? "✓" : "💧"}</div><div class="font-semibold text-xs mt-1">500 ml</div></div></label>`;
    }
    html += `</div>`;
    if (liters >= 1.5) html += `<div class="mt-4 text-center text-sm font-semibold text-green-700 bg-green-50 rounded-2xl py-3">✓ Günlük 1,5 litre minimum hedef tamamlandı</div>`;
    html += `</div>`;
    container.innerHTML = html;
    document.querySelectorAll(".water-checkbox").forEach(checkbox => checkbox.addEventListener("change", async () => {
        const states = { ...getCompletedStates() }; states[checkbox.dataset.waterKey] = checkbox.checked; currentDayData.durumlar = states;
        await setDoc(doc(db,"gunler",String(currentDay)),{durumlar:states},{merge:true}); renderWater();
    }));
}


function updateWater() {

    document
        .querySelectorAll(
            ".water-checkbox"
        )
        .forEach(
            checkbox => {

                const option =
                    checkbox.parentElement
                        .querySelector(
                            ".water-option"
                        );


                if (
                    checkbox.checked
                ) {

                    option.className =
                        "water-option text-center py-4 rounded-2xl border bg-green-100 border-green-400 text-green-700";

                } else {

                    option.className =
                        "water-option text-center py-4 rounded-2xl border bg-slate-50 border-slate-100 text-slate-500";

                }

            }
        );

}


/* =====================================================
   NOTLAR
===================================================== */

function getActiveMedicationsForDay() {

    return medications.filter(
        medication => {

            const startDay =
                Number(
                    medication.startDay ||
                    DIET_START_DAY
                );

            const duration =
                Number(
                    medication.durationDays ||
                    0
                );

            return (
                currentDay >= startDay &&
                currentDay < startDay + duration
            );
        }
    );
}


function renderMedications() {

    const container =
        document.getElementById(
            "medsContent"
        );

    const active =
        getActiveMedicationsForDay();

    const states =
        getCompletedStates();

    if (!active.length) {

        container.innerHTML = `
            <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-8 text-center">
                <div class="text-4xl mb-3">
                    💊
                </div>

                <p class="text-slate-500">
                    Bugün için kullanılacak ilaç bulunmuyor.
                </p>
            </div>
        `;

        return;
    }

    let html =
        `<div class="space-y-4">`;

    active.forEach(
        medication => {

            const times =
                Array.isArray(
                    medication.times
                )
                    ? medication.times
                    : [];

            const startDay =
                Number(
                    medication.startDay ||
                    DIET_START_DAY
                );

            const usedDay =
                currentDay -
                startDay +
                1;

            const remaining =
                Number(
                    medication.durationDays ||
                    0
                ) -
                usedDay;

            html += `
                <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-5">

                    <div class="flex items-start gap-4">

                        <div class="w-12 h-12 rounded-2xl bg-violet-100 flex items-center justify-center text-xl flex-shrink-0">
                            💊
                        </div>

                        <div class="flex-1 min-w-0">

                            <h3 class="font-bold text-slate-800 text-lg">
                                ${escapeHtml(
                                    medication.name
                                )}
                            </h3>

                            ${
                                medication.dose
                                    ? `
                                        <p class="text-sm text-slate-500 mt-1">
                                            ${escapeHtml(
                                                medication.dose
                                            )}
                                        </p>
                                    `
                                    : ""
                            }

                            ${
                                medication.note
                                    ? `
                                        <p class="text-sm text-slate-500 mt-1">
                                            ${escapeHtml(
                                                medication.note
                                            )}
                                        </p>
                                    `
                                    : ""
                            }

                            <p class="text-xs text-violet-500 mt-2">
                                Tedavinin ${usedDay}. günü
                                ${
                                    remaining > 0
                                        ? `• ${remaining} gün kaldı`

                                }
                            </p>

                        </div>

                    </div>

                    <div class="mt-4 space-y-2">

                        ${
                            times.length
                                ? times.map(
                                    (time, index) => {

                                        const key =
                                            `ilac_${medication.id}_${index}`;

                                        const checked =
                                            states[key] === true;

                                        return `
                                            <label
                                                class="med-time-row flex items-center gap-4 bg-violet-50/60 rounded-2xl p-4 cursor-pointer">

                                                <input
                                                    type="checkbox"
                                                    class="checkbox"
                                                    data-type="med"
                                                    data-med-id="${escapeHtml(
                                                        medication.id
                                                    )}"
                                                    data-time-index="${index}"
                                                    ${
                                                        checked
                                                            ? "checked"
                                                            : ""
                                                    }>

                                                <span class="flex-1">

                                                    <strong class="text-slate-700">
                                                        ${escapeHtml(
                                                            time
                                                        )}
                                                    </strong>

                                                    <span class="block text-xs text-slate-500 mt-1">
                                                        ${

    html +=

/* =====================================================
   NOTE NORMALIZE
===================================================== */

function normalizeNotes(
    notes
) {

    if (
        !Array.isArray(
            notes
        )
    ) {

        return [];

    }


    return notes
        .map(
            note => {

                if (
                    typeof note ===
                    "string"
                ) {

                    return {

                        title:
                            "Önemli Not",

                        content:
                            note

                    };

                }


                if (
                    note &&
                    typeof note ===
                    "object"
                ) {

                    return {

                        title:
                            note.title ||
                            note.baslik ||
                            note.başlık ||
                            "Önemli Not",

                        content:
                            note.content ||
                            note.icerik ||
                            note.içerik ||
                            ""

                    };

                }


                return null;

            }
        )
        .filter(
            note =>
                note &&
                note.content
        );

}


/* =====================================================
   NOTE FORMAT
===================================================== */

function formatNoteContent(
    content
) {

    if (
        typeof content !==
        "string"
    ) {

        content =
            String(
                content || ""
            );

    }


    return content
        .split(
            /\r?\n/
        )
        .map(
            line => {

                const text =
                    line.trim();


                if (
                    !text
                ) {

                    return `
                        <div class="h-2"></div>
                    `;

                }


                if (
                    /^[-–—]\s*/.test(
                        text
                    )
                ) {

                    return `

                        <div class="note-bullet">

                            <span class="note-bullet-mark">
                                −
                            </span>

                            <span>
                                ${escapeHtml(
                                    text.replace(
                                        /^[-–—]\s*/,
                                        ""
                                    )
                                )}
                            </span>

                        </div>

                    `;

                }


                return `

                    <p>
                        ${escapeHtml(
                            text
                        )}
                    </p>

                `;

            }
        )
        .join("");

}


/* =====================================================
   NOTE EVENTS
===================================================== */

function attachNoteEvents() {

    document
        .querySelectorAll(
            ".note-toggle"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const index =
                            button.dataset.noteIndex;


                        const content =
                            document.querySelector(
                                `[data-note-content="${index}"]`
                            );


                        const arrow =
                            button.querySelector(
                                ".note-arrow"
                            );


                        if (
                            content.classList.contains(
                                "open"
                            )
                        ) {

                            content.style.maxHeight =
                                "0px";

                            content.classList.remove(
                                "open"
                            );

                            arrow.style.transform =
                                "rotate(0deg)";

                        } else {

                            content.classList.add(
                                "open"
                            );

                            content.style.maxHeight =
                                content.scrollHeight +
                                "px";

                            arrow.style.transform =
                                "rotate(180deg)";

                        }

                    }
                );

            }
        );

}


/* =====================================================
   TAB
===================================================== */

function switchTab(
    tab
) {

    if (tab === "meds") {
        renderMedications();
    }



    currentTab =
        tab;


    document
        .getElementById(
            "foodSection"
        )
        .classList.toggle(
            "hidden",
            tab !== "food"
        );

    document
        .getElementById(
            "waterSection"
        )
        .classList.toggle(
            "hidden",
            tab !== "food"
        );


    document
        .getElementById(
            "tasksSection"
        )
        .classList.toggle(
            "hidden",
            tab !== "tasks"
        );

    document
        .getElementById(
            "medsSection"
        )
        .classList.toggle(
            "hidden",
            tab !== "meds"
        );

    if (tab === "meds") {
        renderMedications();
    }


    document
        .getElementById(
            "notesSection"
        )

        );

                "navMeds"
            ),

            )

    Object

                );

}


document
    .getElementById(
        "navFood"
    )
    .addEventListener(
        "click",
        () => switchTab("food")
    );


document
    .getElementById(
        "navTasks"
    )
    .addEventListener(
        "click",
        () => switchTab("tasks")
    );

document
    .getElementById(
        "navMeds"
    )
    .addEventListener(
        "click",
        () => switchTab("meds")
    );


document
    .getElementById(
        "navNotes"
    )
    .addEventListener(
        "click",
        () => switchTab("notes")
    );


/* =====================================================
   UTILS
===================================================== */

function normalizeArray(
    value
) {

    if (
        Array.isArray(
            value
        )
    ) {

        return value
            .map(
                item => {

                    if (
                        typeof item ===
                        "string"
                    ) {

                        return item;

                    }


                    if (
                        item &&
                        typeof item ===
                        "object"
                    ) {

                        return (
                            item.text ||
                            item.content ||
                            item.icerik ||
                            ""
                        );

                    }


                    return "";

                }
            )
            .filter(Boolean);

    }


    if (
        typeof value ===
        "string"
    ) {

        return value
            .split(
                /\r?\n/
            )
            .map(
                x => x.trim()
            )
            .filter(Boolean);

    }


    return [];

}


function escapeHtml(
    text
) {

    return String(
        text || ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
